name: Release

# Build the mod and publish a GitHub Release whenever a version tag (e.g.
# v0.2.0) is pushed. The landing page in docs/ links to
# releases/latest/download/nyteclient-latest.jar, which always points at
# whatever this workflow published most recently.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Locate build output
        id: jar
        run: |
          jar_path=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" | head -n1)
          if [ -z "$jar_path" ]; then
            echo "No build jar found in build/libs" >&2
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Add stable-named copy for the landing page
        run: cp "${{ steps.jar.outputs.path }}" build/libs/nyteclient-latest.jar

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ steps.jar.outputs.path }}" \
            "build/libs/nyteclient-latest.jar" \
            --title "${{ github.ref_name }}" \
            --generate-notes
